*,*::before,*::after{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
/* Layout: lavagna a due pannelli — cartina reale a sinistra che zooma sul "triangolo" delle sedi, racconto a passi a destra; su telefono si impilano. */
:root{
  --paper:#EEF1F6; --panel:#FFFFFF; --ink:#15203B; --muted:#55607A; --rule:#D3DAE6;
  --sea:#D5E0EE; --land:#E9EDF3; --border:#B3BED0; --eu:#C6D4EB; --gold:#F2B705; --gold-ink:#3B2C00;
  --com:#2148B8; --par:#B4600A; --cons:#0D776C; --ceu:#7A3D9F; --on-inst:#FFFFFF;
  --f-display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", Verdana, system-ui, sans-serif;
  --radius:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1424; --panel:#161F35; --ink:#E7EBF3; --muted:#9BA6BE; --rule:#28334D;
  --sea:#0B172D; --land:#1E2840; --border:#3A4866; --eu:#2B3F68; --gold:#E0AA14; --gold-ink:#1E1600;
  --com:#86A6FF; --par:#F3A851; --cons:#40C6B5; --ceu:#C99BE8; --on-inst:#0E1424; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1424; --panel:#161F35; --ink:#E7EBF3; --muted:#9BA6BE; --rule:#28334D;
  --sea:#0B172D; --land:#1E2840; --border:#3A4866; --eu:#2B3F68; --gold:#E0AA14; --gold-ink:#1E1600;
  --com:#86A6FF; --par:#F3A851; --cons:#40C6B5; --ceu:#C99BE8; --on-inst:#0E1424; color-scheme:dark}

html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-inline:16px}
.app{box-sizing:border-box;height:100%;max-width:1520px;margin:0 auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:14px;padding-block:14px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;min-width:0}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.25rem,1rem + 1vw,1.75rem);margin:0;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:1rem}
.ghost{font:inherit;font-size:.95rem;background:transparent;color:var(--ink);border:1.5px solid var(--rule);border-radius:999px;padding:.4em 1em;cursor:pointer}
.ghost:hover{border-color:var(--ink)}

/* main */
main{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;min-height:0}
.mapwrap{position:relative;min-height:0;background:var(--sea);border-radius:var(--radius);overflow:hidden}
#map{display:block;width:100%;height:100%}
.where{position:absolute;left:14px;top:14px;display:flex;flex-direction:column;gap:2px;background:var(--panel);border-radius:10px;padding:.5em .85em;box-shadow:0 2px 10px rgb(0 0 0 / .12);max-width:calc(100% - 28px)}
.where b{font-family:var(--f-display);font-weight:800;font-size:clamp(1.05rem,.9rem + .7vw,1.45rem);line-height:1.15}
.where small{color:var(--muted);font-size:.95rem;font-variant-numeric:tabular-nums}

.story{min-height:0;overflow:auto;background:var(--panel);border-radius:var(--radius);padding:clamp(18px,2.2vw,34px)}
.scene{display:flex;flex-direction:column;gap:18px;max-width:40rem}
.scene.enter{animation:rise .45s ease both}
@keyframes rise{from{opacity:.0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{font-size:.85rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted);margin:0}
.scene h2{font-family:var(--f-display);font-weight:800;font-size:clamp(1.7rem,1.2rem + 1.8vw,2.7rem);line-height:1.08;letter-spacing:-.015em;margin:0;text-wrap:balance}
.scene p{margin:0;font-size:clamp(1.08rem,.98rem + .45vw,1.35rem);max-width:62ch}
.q{border-left:5px solid var(--gold);padding:.2em 0 .2em 1em;font-family:var(--f-display);font-weight:600;font-size:clamp(1.2rem,1rem + .8vw,1.6rem)!important;line-height:1.25}

/* plugs */
.plugs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.plug{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:.95rem;color:var(--muted)}
.plug svg{width:100%;max-width:92px;height:auto}
.plug svg *{fill:none;stroke:var(--ink);stroke-width:3;stroke-linejoin:round}
.plug svg .fillin{fill:var(--ink);stroke:none}

/* stats */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.stat{border-top:3px solid var(--ink);padding-top:10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat b{font-family:var(--f-display);font-weight:800;font-size:clamp(1.8rem,1.3rem + 1.6vw,2.6rem);line-height:1;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:1.02rem}

/* institution card */
.inst{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;border:2px solid var(--c);border-radius:12px;padding:14px 16px;font-size:1.05rem}
.inst h3{grid-column:1/-1;margin:0 0 4px;font-family:var(--f-display);font-weight:800;font-size:1.3rem;color:var(--c)}
.inst dt{color:var(--muted)}
.inst dd{margin:0;font-weight:700;min-width:0}
.c-com{--c:var(--com)} .c-par{--c:var(--par)} .c-cons{--c:var(--cons)} .c-ceu{--c:var(--ceu)}
.note{background:var(--paper);border-radius:10px;padding:.8em 1em;font-size:1.05rem!important}
.key{background:var(--gold);color:var(--gold-ink);border-radius:10px;padding:.9em 1.1em;font-family:var(--f-display);font-weight:600;font-size:clamp(1.1rem,1rem + .5vw,1.4rem)!important;line-height:1.3}

/* vote */
.vote{display:flex;flex-direction:column;gap:8px}
.vbar{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--rule)}
.vbar span{display:block}
.y{background:var(--par)} .n{background:var(--ink)} .a{background:var(--muted)}
.vleg{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:1.02rem;font-variant-numeric:tabular-nums}
.vleg i{display:inline-block;width:.8em;height:.8em;border-radius:2px;margin-right:.4em;vertical-align:-.05em}

/* timeline */
.tl{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tl li{border-top:4px solid var(--c,var(--gold));padding-top:8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tl b{font-variant-numeric:tabular-nums}
.tl span{color:var(--muted);font-size:.98rem}

/* schema */
.schema{display:flex;flex-direction:column;gap:12px}
.row{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:14px;align-items:start;border-top:1px solid var(--rule);padding-top:12px}
.row .ask{font-family:var(--f-display);font-weight:800;font-size:clamp(1.1rem,1rem + .4vw,1.3rem);line-height:1.2}
.row .ans{display:flex;flex-direction:column;gap:6px;min-width:0}
.tag{display:inline-block;align-self:flex-start;background:var(--c);color:var(--on-inst);font-weight:700;border-radius:7px;padding:.18em .6em;font-size:1.02rem}
.row small{color:var(--muted);font-size:.98rem}

/* seats */
.seats{display:flex;flex-direction:column;gap:12px}
.seat{border-top:3px solid var(--ink);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.seat h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:1.35rem}
.seat h3 small{font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:1rem}
.seat .tags{display:flex;flex-wrap:wrap;gap:6px}
.seat p{font-size:1.02rem!important;color:var(--muted)}
.src{font-size:.88rem!important;color:var(--muted)}

/* footer nav */
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dot{font:inherit;font-variant-numeric:tabular-nums;width:2.3em;height:2.3em;border-radius:50%;border:1.5px solid var(--rule);background:var(--panel);color:var(--muted);cursor:pointer;font-weight:700}
.dot[aria-current="step"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn{font:inherit;font-weight:700;font-size:1.1rem;border-radius:999px;padding:.6em 1.3em;cursor:pointer;border:2px solid var(--ink);background:var(--panel);color:var(--ink);white-space:nowrap}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* map */
.sea{fill:var(--sea)}
.c{fill:var(--land);stroke:var(--border);stroke-width:.7;vector-effect:non-scaling-stroke;transition:fill .5s ease}
#map.show-eu .c.eu{fill:var(--eu)}
#map.show-gold .c.eu{fill:var(--gold)}
.lbl text{font-family:var(--f-display);font-weight:600;letter-spacing:.14em;fill:var(--muted);opacity:.75;text-anchor:middle}
.lbl,.pin,.km,.arrow{transition:opacity .4s ease}
.hide{opacity:0;pointer-events:none}
.pin .dotc{fill:var(--muted);stroke:var(--panel);stroke-width:3}
.pin .city{font-family:var(--f-display);font-weight:800;fill:var(--ink);paint-order:stroke;stroke:var(--sea);stroke-width:6px;stroke-linejoin:round}
.pin.dim .city{fill:var(--muted)}
.pin .ring{fill:none;stroke-width:3;opacity:0;transform-box:fill-box;transform-origin:center}
.pin.on .ring{animation:pulse 1.8s ease-out infinite}
@keyframes pulse{from{transform:scale(1);opacity:.7}to{transform:scale(3.6);opacity:0}}
.chip rect{rx:6px}
.chip text{font-family:var(--f-body);font-weight:700;fill:var(--on-inst)}
.route{fill:none;stroke:var(--ink);stroke-linecap:round}
.route.draw{transition:stroke-dashoffset 1.1s ease .2s}
.arrow polygon{fill:var(--ink)}
.km line{stroke:var(--ink);stroke-linecap:round}
.km text{font-family:var(--f-body);font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--sea);stroke-width:6px;stroke-linejoin:round}

@media (max-width:860px){
  html,body{height:auto}
  .app{height:auto}
  main{grid-template-columns:1fr}
  .mapwrap{aspect-ratio:1/1;max-height:72vh;width:100%;max-width:100%}
  .story{overflow:visible}
  .where{top:auto;bottom:12px;left:12px}

const MAP = {"W":1000,"H":998,"P":{"bruxelles":[383.9,555.2],"strasburgo":[436.7,619.6],"lussemburgo":[410.7,590.4],"roma":[520.6,798.4]},"L":[{"name":"ITALIA","x":522.4,"y":763.8,"views":"full mid"},{"name":"SPAGNA","x":192.7,"y":815.3,"views":"full"},{"name":"POLONIA","x":628.6,"y":523,"views":"full"},{"name":"FRANCIA","x":348.8,"y":655.9,"views":"mid"},{"name":"GERMANIA","x":484.3,"y":557.6,"views":"mid"},{"name":"FRANCIA","x":376.1,"y":620.6,"views":"zoom"},{"name":"GERMANIA","x":465.6,"y":568.9,"views":"zoom"},{"name":"BELGIO","x":389.2,"y":569,"views":"zoom"},{"name":"PAESI BASSI","x":404.9,"y":534.2,"views":"zoom"}],"zoom":[336.3,512.3,151.8,151.5],"dist":{"bruxelles":1173,"strasburgo":829,"lussemburgo":988,"bxStr":352}};

const STEPS = [
 { place:"Europa", date:"Fino a pochi anni fa", view:"full", eu:"", pins:{},

 { place:"In tutta l'Unione europea", date:"Prima del 2021", view:"full", eu:"eu", pins:{},
   html:`<p class="eyebrow">Il problema</p>

   </div>
   <p class="note">Un problema che hanno tutti i paesi si risolve meglio con una regola uguale per tutti. Per questo ci pensa l'Unione europea.</p>`},

 { place:"Bruxelles", date:"Settembre 2021", view:"zoom", eu:"", pins:{bruxelles:["com"]}, on:["bruxelles"],
   html:`<p class="eyebrow">Domanda 1 · Chi propone?</p>
   <h2>La Commissione europea scrive una proposta</h2>
   <p>A Bruxelles la Commissione prepara una proposta di legge: un solo attacco, l'USB-C, per telefoni, tablet, cuffie, fotocamere e console portatili.</p>
   ${card("com",[["Chi c'è","27 commissari, uno per ogni paese"],["Cosa fa","Propone le leggi"],["Sede","Bruxelles"]])}
   <p class="note">La Commissione è il motore: scrive le proposte, ma da sola non può approvarle. Deve convincere altre due istituzioni.</p>`},

 { place:"Strasburgo", date:"4 ottobre 2022", view:"zoom", eu:"", pins:{bruxelles:["com"], strasburgo:["par"]}, on:["strasburgo"], routes:["bs"],
   html:`<p class="eyebrow">Domanda 2 · Chi approva? Primo sì</p>
   <h2>Il Parlamento europeo vota</h2>
   <p>La proposta arriva a Strasburgo. Qui siedono i deputati europei, eletti direttamente dai cittadini di tutti i paesi: anche noi italiani votiamo i nostri. La discutono, la modificano e poi votano.</p>
   <div class="vote" aria-label="Risultato del voto: 602 sì, 13 no, 8 astenuti">
     <div class="vbar"><span class="y" style="flex:602"></span><span class="n" style="flex:13"></span><span class="a" style="flex:8"></span></div>
     <div class="vleg"><span><i class="y"></i>602 sì</span><span><i class="n"></i>13 no</span><span><i class="a"></i>8 astenuti</span></div>
   </div>
   ${card("par",[["Chi c'è","720 deputati, eletti ogni 5 anni"],["Chi rappresenta","I cittadini"],["Sede","Strasburgo (le votazioni) e Bruxelles"]])}`},

 { place:"Bruxelles e Lussemburgo", date:"24 ottobre 2022", view:"zoom", eu:"", pins:{bruxelles:["com","cons"], strasburgo:["par"], lussemburgo:["cons"]}, on:["bruxelles","lussemburgo"], routes:["bs","sb"],
   html:`<p class="eyebrow">Domanda 2 · Chi approva? Secondo sì</p>

   <p class="key">Una legge europea ha bisogno di due sì: quello dei cittadini, nel Parlamento, e quello dei governi, nel Consiglio dell'UE.</p>`},

 { place:"In tutti i 27 paesi", date:"28 dicembre 2024", view:"full", eu:"gold", pins:{},
   html:`<p class="eyebrow">Il risultato</p>

   <p class="note">Dalla proposta ai negozi sono passati più di tre anni. Ora la regola è la stessa da Lisbona a Helsinki.</p>`},

 { place:"Ricapitoliamo", date:"Chi fa cosa", view:"zoom", eu:"", pins:{bruxelles:["com","cons","ceu"], strasburgo:["par"], lussemburgo:["cons"]}, on:["bruxelles","strasburgo","lussemburgo"],
   html:`<p class="eyebrow">Le tre domande</p>
   <h2>Chi fa cosa nell'Unione europea</h2>
   <div class="schema">
     <div class="row"><div class="ask">Chi propone le leggi?</div><div class="ans">${tag("com")}<small>27 commissari, uno per paese</small></div></div>
     <div class="row"><div class="ask">Chi le approva?</div><div class="ans">${tag("par")}<small>i deputati eletti dai cittadini</small>${tag("cons")}<small>i ministri dei governi</small></div></div>
     <div class="row"><div class="ask">Chi indica la direzione?</div><div class="ans">${tag("ceu")}<small>i capi di Stato e di governo dei 27 paesi. Non scrive le leggi: decide le grandi priorità.</small></div></div>

   <p class="note">Ora potete riguardare lo schema completo delle istituzioni: ogni freccia racconta uno dei passaggi che avete visto.</p>`},

 { place:"Le sedi", date:"Dove si trovano", view:"mid", eu:"", pins:{bruxelles:[], strasburgo:[], lussemburgo:[]}, on:[], roma:true,
   html:`<p class="eyebrow">Dove sono</p>
   <h2>Le sedi delle istituzioni</h2>
   <div class="seats">
     <div class="seat"><h3>Bruxelles <small>Belgio</small></h3><div class="tags">${tag("com")}${tag("cons")}${tag("ceu")}</div><p>Anche il Parlamento ha qui molti uffici e riunioni.</p></div>
     <div class="seat"><h3>Strasburgo <small>Francia</small></h3><div class="tags">${tag("par")}</div><p>Qui si tengono le grandi votazioni, dodici volte l'anno. Ogni mese i deputati partono da Bruxelles per venire a votare.</p></div>
     <div class="seat"><h3>Lussemburgo <small>Lussemburgo</small></h3><div class="tags">${tag("cons")}</div><p>Il Consiglio dell'UE si riunisce qui ad aprile, giugno e ottobre. C'è anche la Corte di giustizia, che controlla che le leggi europee siano rispettate.</p></div>
   </div>
   <p class="note">Da Roma a Bruxelles sono circa ${MAP.dist.bruxelles.toLocaleString('it-IT')} km in linea d'aria; da Bruxelles a Strasburgo circa ${MAP.dist.bxStr} km.</p>
   <p class="src">Fonti: Commissione europea, Parlamento europeo, Consiglio dell'UE (direttiva UE 2022/2380 sul caricatore comune).</p>`},
];

/* ---------- map building ---------- */
const svg = document.getElementById('map');
const NS = 'http://www.w3.org/2000/svg';
const el = (t, a={}, p) => { const n = document.createElementNS(NS, t); for (const k in a) n.setAttribute(k, a[k]); if (p) p.appendChild(n); return n; };
const P = MAP.P;
const scalers = []; // groups that keep a constant on-screen size

for (const l of MAP.L) {
  const g = el('g', {class:'lbl'}, document.getElementById('labels'));
  const t = el('text', {y:6, 'font-size':17}, g); t.textContent = l.name;
  scalers.push({g, x:l.x, y:l.y, views:l.views.split(' ')});
}

// routes Bruxelles -> Strasburgo (bowing east) and back (bowing west)
function curve(a, b, bend) {
  const mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2, dx=b[0]-a[0], dy=b[1]-a[1], L=Math.hypot(dx,dy);
  const c=[mx - dy/L*bend*L, my + dx/L*bend*L];
  const shrink = (p, q, d) => { const vx=q[0]-p[0], vy=q[1]-p[1], l=Math.hypot(vx,vy); return [p[0]+vx/l*d, p[1]+vy/l*d]; };
  const s = shrink(a, c, 5.5), e = shrink(b, c, 6.5);
  const ang = Math.atan2(e[1]-c[1], e[0]-c[0]) * 180/Math.PI;
  return {d:`M${s[0]} ${s[1]} Q${c[0]} ${c[1]} ${e[0]} ${e[1]}`, e, ang};
}
const ROUTES = { bs: curve(P.bruxelles, P.strasburgo, -0.42), sb: curve(P.strasburgo, P.bruxelles, -0.42) };
const routeEls = {};
for (const [id, r] of Object.entries(ROUTES)) {
  const path = el('path', {class:'route', d:r.d, pathLength:1, 'stroke-dasharray':'1 1', 'stroke-dashoffset':1}, document.getElementById('routes'));
  const g = el('g', {class:'arrow hide'}, document.getElementById('routes'));
  el('polygon', {points:'4,0 -14,-9 -14,9'}, g);
  scalers.push({g, x:r.e[0], y:r.e[1], rot:r.ang});
  routeEls[id] = {path, g};
}

// Roma -> Bruxelles distance line
const kmG = el('g', {class:'km hide'}, document.getElementById('routes'));
const kmLine = el('line', {x1:P.roma[0], y1:P.roma[1], x2:P.bruxelles[0], y2:P.bruxelles[1]}, kmG);
const kmLbl = el('g', {class:'km hide'}, document.getElementById('routes'));
const kmT = el('text', {x:12, y:6, 'font-size':20}, kmLbl); kmT.textContent = `≈ ${MAP.dist.bruxelles.toLocaleString('it-IT')} km`;
const mid = [(P.roma[0]+P.bruxelles[0])/2, (P.roma[1]+P.bruxelles[1])/2];
scalers.push({g:kmLbl, x:mid[0], y:mid[1], views:['mid']});

// city pins
const CITY = {
  bruxelles:{name:"Bruxelles", side:-1, dy:0},
  lussemburgo:{name:"Lussemburgo", side:1, dy:0},
  strasburgo:{name:"Strasburgo", side:1, dy:0},
  roma:{name:"Roma", side:1, dy:0},
};
const pinEls = {};
for (const [k, c] of Object.entries(CITY)) {
  const g = el('g', {class:'pin hide', 'data-city':k}, document.getElementById('pins'));
  const ring = el('circle', {class:'ring', r:7}, g);
  el('circle', {class:'dotc', r:7}, g);
  const t = el('text', {class:'city', x:16*c.side, y:8, 'font-size':24, 'text-anchor': c.side<0?'end':'start'}, g);
  t.textContent = c.name;
  const chips = el('g', {}, g);
  scalers.push({g, x:P[k][0], y:P[k][1]});
  pinEls[k] = {g, ring, chips, side:c.side};
}

function setChips(k, list) {
  const {chips, side, ring} = pinEls[k];
  chips.replaceChildren();
  ring.style.stroke = list.length ? `var(--${list[list.length-1]})` : 'var(--ink)';
  list.forEach((inst, i) => {
    const cg = el('g', {class:'chip', transform:`translate(0 ${24 + i*30})`}, chips);
    const r = el('rect', {height:26, y:0, fill:`var(--${inst})`}, cg);
    const t = el('text', {y:19, 'font-size':16}, cg); t.textContent = CHIP[inst];
    const w = t.getComputedTextLength() + 18;
    r.setAttribute('width', w);
    if (side < 0) { r.setAttribute('x', -16 - w); t.setAttribute('x', -16 - w + 9); }
    else { r.setAttribute('x', 16); t.setAttribute('x', 25); }
  });
}

/* ---------- view animation ---------- */
let vb = VIEWS.full.slice(), anim = 0, curView = 'full';
function applyVB(b) {
  vb = b;
  svg.setAttribute('viewBox', b.map(v => v.toFixed(2)).join(' '));
  const k0 = b[2] / MAP.W;
  const boost = Math.min(1.5, Math.max(1, 620 / (svg.clientWidth || 620)));
  const k = k0 * boost;
  svg.style.setProperty('--k', k0);
  for (const s of scalers) s.g.setAttribute('transform', `translate(${s.x} ${s.y}) rotate(${s.rot||0}) scale(${k})`);
  document.querySelectorAll('.route').forEach(r => r.style.strokeWidth = (4.5*k).toFixed(3));
  kmLine.style.strokeWidth = (3.5*k).toFixed(3);
  kmLine.setAttribute('stroke-dasharray', `${(10*k).toFixed(2)} ${(9*k).toFixed(2)}`);
}
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function goView(name) {
  const from = vb.slice(), to = VIEWS[name]; curView = name;
  cancelAnimationFrame(anim);
  if (reduce) return applyVB(to.slice());
  const t0 = performance.now(), D = 1000;
  const ease = t => t<.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
  // interpolate in log-space for width so zooming feels even
  const step = now => {
    const t = Math.min(1, (now - t0)/D), e = ease(t);
    const w = Math.exp(Math.log(from[2]) + (Math.log(to[2]) - Math.log(from[2]))*e);
    const h = w * (to[3]/to[2]);
    const cx = from[0]+from[2]/2 + ((to[0]+to[2]/2) - (from[0]+from[2]/2))*e;
    const cy = from[1]+from[3]/2 + ((to[1]+to[3]/2) - (from[1]+from[3]/2))*e;
    applyVB([cx - w/2, cy - h/2, w, h]);
    if (t < 1) anim = requestAnimationFrame(step);
  };
  anim = requestAnimationFrame(step);
}

/* ---------- gold wave from Bruxelles ---------- */
document.querySelectorAll('.c.eu').forEach(p => {
  const b = p.getBBox(); const d = Math.hypot(b.x + b.width/2 - P.bruxelles[0], b.y + b.height/2 - P.bruxelles[1]);
  p.dataset.delay = Math.min(1.4, d / 330).toFixed(2);
});

/* ---------- steps ---------- */
const story = document.getElementById('story');
const dots = document.getElementById('dots');
STEPS.forEach((s, i) => {
  const b = document.createElement('button');
  b.className = 'dot'; b.type = 'button'; b.textContent = i + 1; b.setAttribute('aria-label', `Passo ${i+1}`);
  b.addEventListener('click', () => show(i));
  dots.appendChild(b);
});
let cur = -1;
function show(i) {
  i = Math.max(0, Math.min(STEPS.length - 1, i));
  if (i === cur) return;
  const s = STEPS[i]; cur = i;
  story.innerHTML = `<div class="scene enter">${s.html}</div>`;
  story.scrollTop = 0;
  document.getElementById('wPlace').textContent = s.place;
  document.getElementById('wDate').textContent = s.date;
  [...dots.children].forEach((d, j) => j === i ? d.setAttribute('aria-current','step') : d.removeAttribute('aria-current'));
  document.getElementById('prev').disabled = i === 0;
  const nx = document.getElementById('next'); nx.disabled = i === STEPS.length - 1;

  // map
  const gold = s.eu === 'gold';
  document.querySelectorAll('.c.eu').forEach(p => p.style.transitionDelay = gold ? p.dataset.delay + 's' : '0s');
  svg.classList.toggle('show-eu', s.eu === 'eu');
  svg.classList.toggle('show-gold', gold);
  for (const k of ['bruxelles','strasburgo','lussemburgo']) {
    const list = s.pins[k];
    const vis = list !== undefined;
    pinEls[k].g.classList.toggle('hide', !vis);
    pinEls[k].g.classList.toggle('on', !!(s.on||[]).includes(k));
    pinEls[k].g.classList.toggle('dim', vis && list.length === 0 && s.view === 'zoom');
    setChips(k, list || []);
  }
  pinEls.roma.g.classList.toggle('hide', !s.roma);
  kmG.classList.toggle('hide', !s.roma);
  for (const sc of scalers) if (sc.views) sc.g.classList.toggle('hide', !sc.views.includes(s.view) || (sc.g === kmLbl && !s.roma));
  for (const [id, r] of Object.entries(routeEls)) {
    const on = (s.routes||[]).includes(id);
    const was = r.path.dataset.on === '1';
    r.path.classList.toggle('draw', on && !was);
    r.path.setAttribute('stroke-dashoffset', on ? 0 : 1);
    r.path.style.strokeDashoffset = on ? 0 : 1;
    r.path.dataset.on = on ? '1' : '0';
    r.path.style.opacity = on ? 1 : 0;
    r.g.classList.toggle('hide', !on);
    r.g.style.transitionDelay = on && !was ? '1.1s' : '0s';
  }
  goView(s.view);
  try { history.replaceState(null, '', '#p' + (i + 1)); } catch (e) {}
}
document.getElementById('prev').addEventListener('click', () => show(cur - 1));
document.getElementById('next').addEventListener('click', () => show(cur + 1));
addEventListener('keydown', e => {
  if ((e.key===' '||e.key==='Enter') && e.target.tagName==='BUTTON') return;
  if (['ArrowRight','PageDown',' ','Enter'].includes(e.key)) { e.preventDefault(); show(cur + 1); }
  else if (['ArrowLeft','PageUp','Backspace'].includes(e.key)) { e.preventDefault(); show(cur - 1); }
  else if (e.key === 'Home') show(0);
  else if (e.key === 'End') show(STEPS.length - 1);
});
document.getElementById('fs').addEventListener('click', async () => {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  } catch (e) { document.getElementById('fs').textContent = 'Schermo intero non disponibile'; }
});
document.addEventListener('fullscreenchange', () => {
  document.getElementById('fs').textContent = document.fullscreenElement ? 'Esci da schermo intero' : 'Schermo intero';
});

applyVB(VIEWS.full.slice());
addEventListener('resize', () => applyVB(vb.slice()));
const start = /^#p(\d+)$/.exec(location.hash);
show(start ? +start[1] - 1 : 0);
</script>
